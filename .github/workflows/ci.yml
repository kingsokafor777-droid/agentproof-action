name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: node --version
      - run: npm ci
      - run: npm run validate
  action-contract:
    name: Action contract fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./
        with:
          policy-result: fixtures/policy-result.fail.json
          baseline: fixtures/baseline.existing.json
          output-dir: .agentproof/ci
          fail-on: new
      - run: test -s .agentproof/ci/agentproof.sarif
      - run: test -s .agentproof/ci/agentproof.junit.xml
      - run: test -s .agentproof/ci/agentproof.evidence.json
